  <!-- M-6n: Content-Security-Policy. connect-src stays broad (https:/wss: + localhost) because
       RPC endpoints are user-configurable and Cypress/hardhat run over http://localhost. The hard
       value here is object-src 'none' + base-uri/form-action/frame-ancestors locking. script-src
       keeps 'unsafe-inline'/'unsafe-eval' because of the inline Node polyfill below and the QR
       libraries - externalizing the polyfill + hashing it to drop 'unsafe-inline' is a prod follow-up.
       img-src allows blob: for the wallet picker: AppKit fetches each wallet logo and hands it to
       the DOM as a blob URL, so without it every logo renders broken. No extra origin is reached -
       the bytes were already fetched under the existing https: allowance.
       font-src deliberately does NOT list fonts.reown.com: AppKit hardcodes a webfont there, and
       this project keeps UI assets local. The picker falls back to the system font stack. -->
